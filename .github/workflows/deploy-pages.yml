name: Deploy OmniGuard Telemetry dApp to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & Build Web dApp
        run: |
          # Work around npm/cli#4828 where Windows-generated lockfiles omit @rollup/rollup-linux-x64-gnu
          rm -rf web/node_modules web/package-lock.json
          npm --prefix web install --no-audit --no-fund
          npm --prefix web run build
          test -f web/dist/index.html

      - name: Deploy web/dist to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch web/dist/.nojekyll
          cd web/dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "deploy: OmniGuard Telemetry dApp (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
